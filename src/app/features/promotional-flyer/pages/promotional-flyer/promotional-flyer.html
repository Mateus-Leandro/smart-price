<div>
  <mat-card class="mat-card">
    <mat-card-header>
      <div fxLayout="column">
        <mat-card-title>{{
          `Lista de ${flyerType() === 'quote' ? 'cotações' : 'tabelas de fornecedores'}`
        }}</mat-card-title>
        <mat-card-subtitle
          >{{
            `Selecione a ${flyerType() === 'quote' ? 'cotação' : 'tabela de fornecedor'} na qual deseja visualizar os produtos.`
          }}
        </mat-card-subtitle>
      </div>
    </mat-card-header>
    @if (flyerType()) {
      <app-promotional-flyer-table [flyerType]="flyerType()!" />
    }
  </mat-card>
</div>
