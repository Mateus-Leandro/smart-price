<div class="table-container" fxLayout="column">
  <div class="table-wrapper">
    @if (loading()) {
      <div class="spinner-overlay">
        <app-spinner />
      </div>
    }

    <div fxLayout="row" fxLayoutAlign="start center" style="padding: 10px 0">
      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>Pesquisar produto</mat-label>
        <input matInput type="search" (input)="onSearch($event)" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" class="default-table zebra-simple">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.productId }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let element">{{ element.productName }}</td>
      </ng-container>

      @for (branch of branchColumns; track branch.brancheId) {
        <ng-container [matColumnDef]="brancheColumnId(branch.brancheId)">
          <th mat-header-cell *matHeaderCellDef>{{ branch.brancheName }}</th>
          <td mat-cell *matCellDef="let element">
            <input
              class="only-line"
              type="text"
              style="width: 80px"
              [formControl]="getMarginControl(element.productId, branch.brancheId)"
              mask="separator.2"
              suffix="%"
              decimalMarker=","
              [dropSpecialCharacters]="true"
              [showMaskTyped]="false"
              [allowNegativeNumbers]="false"
              (blur)="onMarginBlur($event, getBranch(element, branch.brancheId), element.productId)"
              (click)="$event.stopPropagation()"
            />
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
      <tr mat-row *matRowDef="let row; columns: columnsToDisplay" style="cursor: default"></tr>
    </table>

    <mat-paginator
      [length]="paginatorDataSource.records.count"
      [pageSize]="paginatorDataSource.pageSize"
      [pageIndex]="paginatorDataSource.pageIndex"
      [pageSizeOptions]="[5, 10, 25, 50, 100]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
